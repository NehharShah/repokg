name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: smoke test on this repo
        run: |
          repokg generate . --no-github
          test -s KNOWLEDGE_GRAPH.md && test -s .repokg/kg.json

  # The action is YAML, so unittest cannot reach it. Exercised against a
  # throwaway repo rather than against repokg itself, which has no committed
  # graph to check — see #22.
  action:
    name: action (check mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build a fixture repo whose graph matches HEAD
        run: |
          set -euo pipefail
          pip install --quiet .
          mkdir -p "$RUNNER_TEMP/fixture/app"
          cd "$RUNNER_TEMP/fixture"
          : > app/__init__.py
          echo 'x = 1' > app/main.py
          git init -q -b main .
          git config user.email t@x
          git config user.name t
          git add -A
          git commit -qm base
          repokg generate . --no-github

      - name: a graph matching HEAD passes
        id: fresh
        uses: ./
        with:
          path: ${{ runner.temp }}/fixture
      - name: ... and reports itself not stale
        run: |
          test "${{ steps.fresh.outputs.stale }}" = "false"

      - name: move HEAD past the graph
        run: |
          cd "$RUNNER_TEMP/fixture"
          echo 'y = 2' >> app/main.py
          git add -A
          git commit -qm second

      - name: strict false warns and lets the job pass
        id: warned
        uses: ./
        with:
          path: ${{ runner.temp }}/fixture
          strict: "false"
      - name: ... but still reports the graph stale
        run: |
          test "${{ steps.warned.outputs.stale }}" = "true"

      - name: strict true fails the step
        id: failed
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/fixture
      - name: ... and says so in the outcome
        run: |
          test "${{ steps.failed.outcome }}" = "failure"

      # The distinction the exit codes exist for: repokg failing to run is not
      # a verdict that the graph is stale, and must not send anyone off to
      # regenerate a file that was never the problem.
      - name: a path that does not exist is an error, not a stale graph
        id: broken
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/no-such-dir
      - name: ... reported as a failure with stale unset
        run: |
          test "${{ steps.broken.outcome }}" = "failure"
          test "${{ steps.broken.outputs.stale }}" != "true"

      - name: an unknown mode is refused
        id: badmode
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/fixture
          mode: sideways
      - run: test "${{ steps.badmode.outcome }}" = "failure"

  # Comment mode without a pull request: everything except the API call,
  # which only a real PR can exercise — and does, via kg-diff.yml.
  comment:
    name: action (comment mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build a fixture repo whose second commit adds a module
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fx/app" "$RUNNER_TEMP/fx/lib"
          cd "$RUNNER_TEMP/fx"
          : > app/__init__.py
          echo 'from lib import helper' > app/main.py
          : > lib/__init__.py
          echo 'def helper(): pass' > lib/helper.py
          git init -q -b main .
          git config user.email t@x
          git config user.name t
          git add -A
          git commit -qm base
          echo "FIRST=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p billing
          : > billing/__init__.py
          echo 'def charge(): pass' > billing/charge.py
          printf 'from lib import helper\nfrom billing import charge\n' > app/main.py
          git add -A
          git commit -qm second

      - name: a new module and edge is a shape change
        id: changed
        uses: ./
        with:
          path: ${{ runner.temp }}/fx
          mode: comment
          base: ${{ env.FIRST }}
      - name: ... reported as changed, with the report where it says it is
        env:
          REPORT: ${{ steps.changed.outputs.report-path }}
        run: |
          test "${{ steps.changed.outputs.changed }}" = "true"
          # not $GITHUB_STEP_SUMMARY: each step gets its own summary file,
          # so what the action wrote is not readable from here
          grep -q "repokg:diff" "$REPORT"
          grep -q "billing" "$REPORT"
          # two refs, so neither side is a working tree and the report must
          # carry no note about untracked files
          ! grep -q "holds files no commit does" "$REPORT"

      - name: a ref against itself is not a shape change
        id: same
        uses: ./
        with:
          path: ${{ runner.temp }}/fx
          mode: comment
          base: HEAD
      - run: test "${{ steps.same.outputs.changed }}" = "false"

      - name: a base that does not exist is an error, not a shape change
        id: badbase
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/fx
          mode: comment
          base: no-such-ref
      - run: |
          test "${{ steps.badbase.outcome }}" = "failure"
          test "${{ steps.badbase.outputs.changed }}" != "true"
